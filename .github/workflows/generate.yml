name: Generate folktale videos (download only)

# Use this to MAKE videos on GitHub without publishing to YouTube.
#   Actions tab → "Generate folktale videos (download only)" → Run workflow.
# It renders every script in content/ into a narrated, illustrated MP4 with a
# repository-locked voice and matching storytime look, then attaches the videos
# as a downloadable artifact. Nothing is uploaded to YouTube and no scripts are
# archived, so you can tweak a script and generate again.
#
# Secrets:
#   ANTHROPIC_API_KEY   required only to verify the configured presenter
#   CF_IMAGE_TOKEN      optional; provides higher image-generation limits

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CF_INPUT: ${{ github.workspace }}/content
      CF_OUTPUT: ${{ github.workspace }}/_render
      CF_STYLE: story
      # Reference "overlay" layout: a full-frame scenic background with the host in a
      # framed card, an audio-reactive waveform, a SUBSCRIBE badge, and karaoke
      # captions. No per-scene image generation (its cost, slowness, and timeouts are
      # gone), so renders finish in minutes.
      CF_LAYOUT: overlay
      CF_BACKGROUND_IMAGE: ${{ github.workspace }}/worker/assets/background/coast.jpg
      # Every story uses a 5.5-second visual target. Resolution remains 1080p
      # below 35 minutes and 720p from 35 minutes upward.
      # Every narrated word is retained.
      CF_SCENE_SECONDS: "5.5"
      CF_HD_MAX_MINUTES: "35"
      CF_SHORT_SCENE_SECONDS: "5.5"
      CF_IMG_CONCURRENCY: "6"
      # The public image endpoint can be slow or temporarily overloaded. Keep
      # several requests in flight and pace starts modestly so a 400+ scene video
      # finishes generating images well inside the job timeout; stragglers are
      # repaired a few at a time. A busy endpoint self-throttles via 429 backoff,
      # so higher concurrency is safe. (A single 451-scene render previously spent
      # ~5h45m here at concurrency 3 / 1500ms spacing and hit the 350m timeout.)
      CF_IMAGE_REQUEST_TIMEOUT_MS: "90000"
      CF_IMAGE_MIN_INTERVAL_MS: "600"
      CF_IMG_REPAIR_CONCURRENCY: "3"
      CF_IMG_REPAIR_ROUNDS: "6"
      CF_IMAGE_ENHANCE: "0"
      CF_WIDTH: "1920"
      CF_HEIGHT: "1080"
      # One hour at 5.5 seconds per scene is about 655 individually generated
      # images. The 720 cap leaves headroom; extra-long scripts stretch scenes
      # rather than losing narration.
      CF_MAX_SCENES: "720"
      CF_TIME_BUDGET_MIN: "240"
      # Manual generation must never pass green without producing a video.
      CF_REQUIRE_INPUT: "1"
      # Permanently locked Brian male narration
      CF_TTS_PROVIDER: edge
      CF_EDGE_VOICE: en-US-BrianNeural
      # Every video and matching thumbnail use one verified male presenter.
      # The renderer also enforces this value and ignores caller overrides.
      CF_PRESENTER_GENDER: male
      # Channel host lock: the same consistent white American man in every video.
      # The renderer reuses this exact portrait instead of generating a new,
      # unique presenter per video (no age matching, no variety).
      CF_LOCKED_PRESENTER: ${{ github.workspace }}/worker/assets/presenter/host.jpg
      CF_EDGE_RATE: "-5%"
      CF_EDGE_PITCH: "+0Hz"
      # Generate only: do not upload, do not archive
      CF_YT_UPLOAD: "0"
      CF_ARCHIVE: "0"
      CF_THUMBNAILS: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CF_REQUIRE_ANTHROPIC: "1"
      CF_SEO: "0"
      CF_CHARACTERS: "0"
      CF_SCENE_VISUALS: "0"
      CF_SEO_MODEL: claude-haiku-4-5-20251001
      CF_IMAGE_TOKEN: ${{ secrets.CF_IMAGE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate inputs and required presenter verification
        run: node worker/preflight.mjs

      - name: Restore presenter uniqueness history
        uses: actions/cache@v5
        with:
          path: _render/.presenter-history.json
          key: presenter-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            presenter-history-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install narration + caption deps (edge-tts, pillow)
        run: python3 -m pip install --upgrade edge-tts pillow

      - name: Render folktales
        working-directory: worker
        run: node watch.mjs --once

      - name: Upload finished videos
        uses: actions/upload-artifact@v7
        with:
          name: folktale-videos
          if-no-files-found: error
          retention-days: 14
          path: |
            _render/*.mp4
            _render/*-thumbnail.jpg
            _render/*.txt
            _render/.presenter-history.json
