name: Generate folktale videos (download only)

# Use this to MAKE videos on GitHub without publishing to YouTube.
#   Actions tab → "Generate folktale videos (download only)" → Run workflow.
# It renders every script in content/ into a narrated, illustrated MP4 (locked
# Jenny voice + matching storytime look) and attaches the videos as a downloadable
# artifact. Nothing is uploaded to YouTube and no scripts are archived, so you
# can tweak a script and generate again.
#
# Secrets:
#   ANTHROPIC_API_KEY   required only to verify the female presenter
#   CF_IMAGE_TOKEN      optional; provides higher image-generation limits

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CF_INPUT: ${{ github.workspace }}/content
      CF_OUTPUT: ${{ github.workspace }}/_render
      CF_STYLE: story
      # Stories under 35 minutes stay at 1080p with frequent 12-second visual beats.
      # Stories from 35 minutes through a full hour use 720p and 20-second beats.
      # Every narrated word is retained; only the picture cadence changes.
      CF_SCENE_SECONDS: "20"
      CF_HD_MAX_MINUTES: "35"
      CF_SHORT_SCENE_SECONDS: "12"
      CF_IMG_CONCURRENCY: "3"
      CF_IMAGE_REQUEST_TIMEOUT_MS: "90000"
      CF_WIDTH: "1920"
      CF_HEIGHT: "1080"
      # A one-hour story gets up to 180 images (one about every 20 seconds).
      # Extra-long scripts stretch scenes rather than losing narration.
      CF_MAX_SCENES: "180"
      CF_TIME_BUDGET_MIN: "240"
      # Manual generation must never pass green without producing a video.
      CF_REQUIRE_INPUT: "1"
      # Locked Jenny narration
      CF_TTS_PROVIDER: edge
      CF_EDGE_VOICE: en-US-JennyNeural
      CF_EDGE_RATE: "-5%"
      CF_EDGE_PITCH: "+0Hz"
      # Generate only: do not upload, do not archive
      CF_YT_UPLOAD: "0"
      CF_ARCHIVE: "0"
      CF_THUMBNAILS: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CF_REQUIRE_ANTHROPIC: "1"
      CF_SEO: "0"
      CF_CHARACTERS: "0"
      CF_SCENE_VISUALS: "0"
      CF_SEO_MODEL: claude-haiku-4-5-20251001
      CF_IMAGE_TOKEN: ${{ secrets.CF_IMAGE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate inputs and required presenter verification
        run: node worker/preflight.mjs

      - name: Restore presenter uniqueness history
        uses: actions/cache@v5
        with:
          path: _render/.presenter-history.json
          key: presenter-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            presenter-history-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install narration + caption deps (edge-tts, pillow)
        run: python3 -m pip install --upgrade edge-tts pillow

      - name: Render folktales
        working-directory: worker
        run: node watch.mjs --once

      - name: Upload finished videos
        uses: actions/upload-artifact@v7
        with:
          name: folktale-videos
          if-no-files-found: error
          retention-days: 14
          path: |
            _render/*.mp4
            _render/*-thumbnail.jpg
            _render/*.txt
            _render/.presenter-history.json
