name: Publish folktales to YouTube

# How it works:
#   1. You write a folktale as a plain .txt file in the content/ folder and push it.
#   2. This workflow renders it with a repository-locked voice and verified
#      presenter, creates the matching thumbnail, and uploads it to YouTube.
#   3. The published script is moved to content/published/ and the upload ledger
#      (content/.cf-uploaded.json) is committed back, so a tale is never made twice.
#   4. If a newly added script is accidentally put in content/published/, preflight
#      safely recovers that new file before rendering instead of silently doing nothing.
#
# Narration is FREE via edge-tts (Microsoft Edge neural voices) — no key needed.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN   YouTube auto-upload
#   ANTHROPIC_API_KEY                       presenter verification only
#   CF_IMAGE_TOKEN                          (optional) Pollinations token, higher limits
# Optional repo variable:
#   CF_YT_PRIVACY   public | unlisted | private   (default: private)

on:
  push:
    branches: [main, master]
    paths:
      - "content/**"
      - "worker/**"
      - ".github/workflows/publish.yml"
  schedule:
    # Daily at 06:00 UTC — publishes anything new sitting in content/.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Allow the job to commit the published/ move + ledger back to the repo.
permissions:
  contents: write

# Never run two publishers at once (avoids double uploads and push races).
concurrency:
  group: publish-youtube
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Five-second scenes create a large image batch, especially for a one-hour
    # video. Use nearly the full GitHub Actions window while retaining headroom.
    timeout-minutes: 350
    env:
      # True only once a YouTube channel is connected (YT_REFRESH_TOKEN secret set).
      # Until then this workflow does nothing — use the "Generate" workflow to make
      # and download videos without publishing.
      HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
      CF_INPUT: ${{ github.workspace }}/content
      CF_OUTPUT: ${{ github.workspace }}/_render
      CF_STYLE: story
      # Every story uses a five-second visual target. Resolution remains 1080p
      # below 35 minutes and 720p from 35 minutes upward.
      # Every narrated word is retained.
      CF_SCENE_SECONDS: "5"
      CF_HD_MAX_MINUTES: "35"
      CF_SHORT_SCENE_SECONDS: "5"
      CF_IMG_CONCURRENCY: "3"
      CF_IMAGE_REQUEST_TIMEOUT_MS: "90000"
      CF_WIDTH: "1920"
      CF_HEIGHT: "1080"
      # One hour at five seconds per scene is 720 individually generated images.
      # Extra-long scripts stretch scenes rather than losing narration.
      CF_MAX_SCENES: "720"
      # Publish exactly one story per run. Its archive commit automatically starts
      # the next queued story, avoiding several long renders in one five-hour job.
      CF_MAX_FILES_PER_RUN: "1"
      CF_TIME_BUDGET_MIN: "240"
      # A queued push may be superseded by an earlier serialized run that already
      # published its script. Treat that as a clean no-op, not a false failure.
      CF_REQUIRE_INPUT: "0"
      # Voice — Brian, permanently locked via edge-tts (no key, no card)
      CF_TTS_PROVIDER: edge
      CF_EDGE_VOICE: en-US-BrianNeural
      # Every video and matching thumbnail use one verified male presenter.
      # The renderer also enforces this value and ignores caller overrides.
      CF_PRESENTER_GENDER: male
      CF_EDGE_RATE: "-5%"
      CF_EDGE_PITCH: "+0Hz"
      # Claude — restricted to mandatory presenter verification. Disabling the
      # optional scene/SEO calls keeps API use and API-related failures minimal.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CF_REQUIRE_ANTHROPIC: "1"
      CF_SEO: "0"
      CF_CHARACTERS: "0"
      CF_SCENE_VISUALS: "0"
      CF_SEO_MODEL: claude-haiku-4-5-20251001
      # Images
      CF_IMAGE_TOKEN: ${{ secrets.CF_IMAGE_TOKEN }}
      # YouTube upload
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      CF_YT_PRIVACY: ${{ vars.CF_YT_PRIVACY || 'private' }}
      CF_THUMBNAILS: "1"

    steps:
      - name: YouTube not connected — skipping
        if: env.HAS_YT != 'true'
        run: |
          echo "::notice::No YT_REFRESH_TOKEN secret set, so no channel is connected yet."
          echo "This auto-publish workflow does nothing until you connect a YouTube channel."
          echo "To make videos now, run the 'Generate folktale videos (download only)' workflow."

      - name: Check out repository
        if: env.HAS_YT == 'true'
        uses: actions/checkout@v6
        with:
          # Serialized runs can wait for hours. Always process the latest branch
          # tip when the job starts so an old queued SHA cannot upload duplicates.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate inputs and recover a misplaced new script
        if: env.HAS_YT == 'true'
        id: preflight
        run: node worker/preflight.mjs

      - name: Restore presenter uniqueness history
        if: env.HAS_YT == 'true' && steps.preflight.outputs.has_input == 'true'
        uses: actions/cache@v5
        with:
          path: _render/.presenter-history.json
          key: presenter-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            presenter-history-

      - name: Set up Node.js
        if: env.HAS_YT == 'true' && steps.preflight.outputs.has_input == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install ffmpeg
        if: env.HAS_YT == 'true' && steps.preflight.outputs.has_input == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install narration + caption deps (edge-tts, pillow)
        if: env.HAS_YT == 'true' && steps.preflight.outputs.has_input == 'true'
        run: python3 -m pip install --upgrade edge-tts pillow

      - name: Render new folktales and upload to YouTube
        if: env.HAS_YT == 'true' && steps.preflight.outputs.has_input == 'true'
        working-directory: worker
        run: node watch.mjs --once

      - name: Save rendered videos as a downloadable artifact
        if: env.HAS_YT == 'true' && steps.preflight.outputs.has_input == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: folktale-videos
          if-no-files-found: error
          retention-days: 14
          path: |
            _render/*.mp4
            _render/*-thumbnail.jpg
            _render/*.txt
            _render/.presenter-history.json

      - name: Commit published tales and ledger
        if: env.HAS_YT == 'true' && steps.preflight.outputs.has_input == 'true'
        run: |
          git config user.name  "griot-studio-bot"
          git config user.email "actions@github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No new tales were published."
          else
            # This commit starts the next serialized run. That run processes the
            # next pending story, or exits cleanly when the queue is empty.
            git commit -m "chore: publish folktale(s)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
